name: Build and Deploy

on:
  push:
    branches:
      - "master"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build the Docker image with latest tag
        run: |
          IMAGE_TAG="tapontikes/golf-ri.com:latest"
          docker build . --file Dockerfile --tag $IMAGE_TAG

      - name: Push the Docker image
        run: |
          IMAGE_TAG="tapontikes/golf-ri.com:latest"
          docker push $IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy the Docker Compose stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SERVER_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd /home/tom/ri-tee-times/

            # Get latest compose file and config changes
            git pull origin master

            # Pull the latest app image
            docker pull tapontikes/golf-ri.com:latest

            # Run migrations to completion before touching the app
            docker compose run --rm migrate

            # Restart the app container with the new image
            docker compose up -d --no-deps --force-recreate app

            # Clean up dangling images
            docker image prune -f

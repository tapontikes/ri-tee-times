services:
  app:
    image: tapontikes/golf-ri.com:latest
    restart: unless-stopped
    # Non-root: matches the "node" user (uid/gid 1000) inside the image.
    # The container refuses to run as root even if the image regresses.
    user: "1000:1000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL}
      SESSION_SECRET: ${SESSION_SECRET}
      LAUNCHDARKLY_SDK_KEY: ${LAUNCHDARKLY_SDK_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    # Only the host's nginx talks to the app: publish on loopback, not on every interface.
    ports:
      - "127.0.0.1:3000:3000"
    # Defense in depth: drop every Linux capability; no setuid escalation
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The app never writes to its own filesystem (docker diff is empty), so lock it down.
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

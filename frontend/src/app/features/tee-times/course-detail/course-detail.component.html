<div class="page-wrapper">

  <!-- Top nav strip -->
  <div class="nav-strip">
    <p-button (onClick)="goBack()" [text]="true" icon="pi pi-arrow-left" label="Back"></p-button>
    <p-button (onClick)="goToCoursePage()" *ngIf="course?.booking_url" [text]="true"
              icon="pi pi-external-link" iconPos="right" label="Course Page"></p-button>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="error-container">
    <i class="pi pi-exclamation-triangle" style="font-size:2rem;color:#d32f2f"></i>
    <p>Failed to load tee times. Please try again.</p>
  </div>

  <!-- Course banner — always rendered so date picker is mounted immediately -->
  <div class="course-banner">
    <h1 class="banner-title">{{ course?.name ?? '&nbsp;' }}</h1>
    <div class="banner-controls">
      <div class="hole-toggle">
        <button (click)="filterByHoles(9)" [class.active]="searchParams.holes === 9" class="toggle-btn">9H</button>
        <button (click)="filterByHoles(18)" [class.active]="searchParams.holes === 18" class="toggle-btn">18H</button>
        <button (click)="filterByHoles(10)" [class.active]="searchParams.holes === 10" class="toggle-btn">All</button>
      </div>
      <p-datepicker (onSelect)="onDateChange($event)"
                    [(ngModel)]="selectedDate"
                    [maxDate]="maxDate"
                    [minDate]="minDate"
                    [showButtonBar]="false"
                    [showIcon]="true"
                    appendTo="body"
                    styleClass="banner-datepicker">
      </p-datepicker>
      <p-select (onChange)="changeCourse($event.value)"
                [ngModel]="courseId"
                [options]="allCourses"
                appendTo="body"
                optionLabel="name"
                optionValue="id"
                placeholder="Switch Course"
                styleClass="course-select">
      </p-select>
    </div>
  </div>

  <!-- Skeleton loading -->
  <ng-container *ngIf="loading">
    <div *ngFor="let _ of skeletonGroups" class="skeleton-group">
      <div class="skeleton-hour-header"></div>
      <div class="tee-list">
        <div *ngFor="let __ of skeletonRows" class="tee-row skeleton-row">
          <div class="skeleton-line sk-time"></div>
          <div class="skeleton-line sk-spots"></div>
          <div class="skeleton-line sk-holes"></div>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- No results -->
  <div *ngIf="!loading && !error && filteredTeeTimes.length === 0" class="no-results">
    <i class="pi pi-flag" style="font-size:2rem"></i>
    <p>No tee times available for the selected date.</p>
  </div>

  <!-- Tee times grouped by hour -->
  <div *ngIf="!loading && filteredTeeTimes.length > 0" class="tee-times-section">
    <div *ngFor="let hourGroup of hourGroups" class="hour-group">

      <div class="hour-label">
        <i class="pi pi-clock hour-icon"></i>
        {{ hourGroup.label }}
      </div>

      <div class="tee-list">
        <div (click)="bookTeeTime(teeTime)"
             *ngFor="let teeTime of hourGroup.teeTimes"
             class="tee-row">
          <div class="tee-row-time">{{ teeTime.time | date:'shortTime' }}</div>
          <div class="tee-row-spots">{{ teeTime.spots }} spots</div>
          <div class="tee-row-holes">
            <p-tag *ngFor="let hole of teeTime.holes"
                   [value]="hole + 'H'"
                   severity="secondary"
                   styleClass="hole-tag">
            </p-tag>
          </div>
          <i class="pi pi-chevron-right tee-row-chevron"></i>
        </div>
      </div>

    </div>
  </div>

</div>

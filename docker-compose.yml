services:
  migrate:
    image: tapontikes/golf-ri.com:latest
    command: node ./database/migrate.js
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - pg

  app:
    image: tapontikes/golf-ri.com:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL}
      SESSION_SECRET: ${SESSION_SECRET}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED}
      REFRESH_ON_STARTUP: ${REFRESH_ON_STARTUP}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    networks:
      - pg

  postgres:
    image: bitnami/postgresql
    container_name: golf-tee-times-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRESQL_PERFORM_RESTORE: true
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pg

volumes:
  postgres_data:

networks:
  pg:

<div class="login-page">
  <div class="login-container">

    <div *ngIf="submitting" class="loading-overlay">
      <p-progressspinner strokeWidth="4"></p-progressspinner>
      <p>Logging in...</p>
    </div>

    <div class="card-header">
      <div class="card-header-course">{{ course.name }}</div>
      <div *ngIf="teeTime" class="card-header-tiles">
        <div class="card-header-tile"><i class="pi pi-calendar"></i>{{ teeTime.time | date:'EEE, MMM d' }}</div>
        <div class="card-header-tile"><i class="pi pi-clock"></i>{{ teeTime.time | date:'shortTime' }}</div>
        <div class="card-header-tile"><i class="pi pi-users"></i>{{ teeTime.spots }} spots</div>
        <div class="card-header-tile"><i class="pi pi-flag"></i>{{ teeTime.holes.join(' / ') }}H</div>
      </div>
    </div>

    <div class="login-form-container">
      <div class="form-section-label">TeeSnap Login</div>
      <form (ngSubmit)="onSubmit()" [formGroup]="loginForm" class="login-form">
        <input formControlName="domain" type="hidden">

        <div class="field">
          <label for="email">Email</label>
          <input class="w-full" formControlName="email" id="email" pInputText placeholder="Enter your Teesnap email"
                 type="email"/>
          <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')"
                 class="field-error">Email is required</small>
          <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')"
                 class="field-error">Please enter a valid email</small>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <p-password [feedback]="false" [toggleMask]="true" formControlName="password" id="password"
                      inputStyleClass="w-full" placeholder="Enter your Teesnap password"
                      styleClass="w-full"></p-password>
          <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')"
                 class="field-error">Password is required</small>
        </div>

        <div class="form-actions">
          <p-button (onClick)="cancel()" [text]="true" icon="pi pi-arrow-left" label="Back" severity="secondary"
                    type="button"></p-button>
          <p-button (onClick)="onSubmit()" [disabled]="loginForm.invalid || submitting" icon="pi pi-sign-in"
                    label="Login" type="submit"></p-button>
        </div>
      </form>
    </div>

  </div>
</div>

name: Build and Deploy

on:
  push:
    branches:
      - "master"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build the Docker image with latest tag
        run: |
          IMAGE_TAG="tapontikes/golf-ri.com:latest"
          
          # Build the Docker image and tag it as 'latest'
          docker build . --file Dockerfile --tag $IMAGE_TAG

      - name: Push the Docker image
        run: |
          IMAGE_TAG="tapontikes/golf-ri.com:latest"
          
          # Push the image with the 'latest' tag
          docker push $IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy the Docker Compose stack
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_IP }} << 'EOF'
          set -e
          cd /home/tom/ri-tee-times/

          # Get latest compose file and config changes
          git pull origin master

          # Pull the latest app image
          docker pull tapontikes/golf-ri.com:latest

          # Run migrations to completion before touching the app
          docker compose run --rm migrate

          # Restart the app container with the new image
          docker compose up -d --no-deps --force-recreate app

          # Clean up dangling images
          docker image prune -f

          EOF

name: Build and Deploy

on:
  push:
    branches:
      - "master"
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch'
        required: true
        default: 'master'
        type: string

# Least privilege: jobs only read the repo. Third-party actions are pinned to full commit SHAs.
permissions:
  contents: read

# Never run two deploys at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'master' }}
          persist-credentials: false

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build and Push Docker image
        run: |
          IMAGE_TAG="tapontikes/golf-ri.com:latest"
          docker build . --file Dockerfile --tag $IMAGE_TAG
          docker push $IMAGE_TAG

  migrate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'master' }}
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0   # pinned: CLI v3.0.0 (released 2026-11-02) dropped [inbucket] from config.toml and broke "db push"

      - name: Run migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref edxdyclutuevzbkaisjd
          supabase db push

  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - name: Deploy the Docker Compose stack
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SERVER_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          # DEPLOY_KEY_V2 is locked on the server to ONE forced command (~/bin/deploy-golf.sh,
          # see deploy/deploy-golf.sh in this repo): it can only deploy, never open a shell or run
          # anything else, so this key being leaked is far less damaging than the old one.
          key: ${{ secrets.DEPLOY_KEY_V2 }}
          # The branch is passed as data (validated server-side against an allow-pattern and the
          # list of real remote branches) instead of being pasted into a shell script.
          script: deploy ${{ github.event.inputs.target_branch || 'master' }}

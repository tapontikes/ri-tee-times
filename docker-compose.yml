services:
  app:
    image: tapontikes/golf-ri.com:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL}
      SESSION_SECRET: ${SESSION_SECRET}
      LAUNCHDARKLY_SDK_KEY: ${LAUNCHDARKLY_SDK_KEY}
    ports:
      - "3000:3000"

name: Build and Deploy

on:
  push:
    branches:
      - "master"
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch'
        required: true
        default: 'master'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'master' }}

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Docker image
        run: |
          IMAGE_TAG="tapontikes/golf-ri.com:latest"
          docker build . --file Dockerfile --tag $IMAGE_TAG
          docker push $IMAGE_TAG

  migrate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'master' }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Run migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref edxdyclutuevzbkaisjd
          supabase db push

  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - name: Deploy the Docker Compose stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SERVER_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd /home/tom/ri-tee-times/

            git fetch origin
            git checkout ${{ github.event.inputs.target_branch || 'master' }}
            git pull origin ${{ github.event.inputs.target_branch || 'master' }}

            docker pull tapontikes/golf-ri.com:latest
            docker compose up -d --no-deps --force-recreate app
            docker image prune -f

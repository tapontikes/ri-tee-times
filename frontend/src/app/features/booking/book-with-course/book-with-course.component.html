<div class="dialog-body">

  <!-- Date + time row -->
  <div class="tee-summary">
    <div class="summary-date">{{ data.teeTime.time | date:'EEEE, MMMM d, y' }}</div>
    <div class="summary-time-row">
      <span class="summary-time">{{ data.teeTime.time | date:'shortTime' }}</span>
      <span class="summary-sep">·</span>
      <span class="summary-spots">{{ data.teeTime.spots }} spots available</span>
    </div>
    <div class="summary-badges">
      <span *ngFor="let hole of data.teeTime.holes" class="badge badge-holes">{{ hole }}H</span>
      <span *ngIf="data.teeTime.start" class="badge badge-start">
        <i class="pi pi-flag"></i>{{ formatTeeOff(data.teeTime.start) }}
      </span>
    </div>
  </div>

  <!-- Hint -->
  <p class="booking-hint">
    <i class="pi pi-external-link"></i>
    Opens the course's booking website in a new tab.
  </p>

  <!-- Actions -->
  <div class="dialog-actions">
    <p-button (onClick)="cancel()" label="Cancel" severity="secondary" variant="outlined"></p-button>
    <p-button (onClick)="bookWithCourse()" icon="pi pi-arrow-right" iconPos="right"
              label="Book on Website"></p-button>
  </div>

</div>
